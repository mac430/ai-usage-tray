# 自動打包 Windows exe
# - 推送到 main：打包並跑測試，成品放在該次執行的 Artifacts（登入 GitHub 才能下載，保留 30 天）
# - 推送 v 開頭的標籤（例如 v0.3.0）：另外建立 Release，附上 zip 與 .sha256（程式內的自動更新用來驗證），任何人都能下載
# - 也可以在 Actions 頁面手動按「Run workflow」
name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: 測試
        shell: pwsh
        run: python -m pytest -q

      - name: 檢查標籤與版本號一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import aiusage; print(aiusage.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "標籤 ${{ github.ref_name }} 跟程式版本 v$v 不一致" }

      - name: 打包
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw "打包失敗" }

      - name: 壓縮
        id: zip
        shell: pwsh
        run: |
          $name = if ("${{ github.ref_type }}" -eq "tag") { "AIUsageTray-win-${{ github.ref_name }}.zip" } else { "AIUsageTray-win.zip" }
          Compress-Archive -Path dist\AIUsageTray -DestinationPath $name -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "$name.sha256" -Encoding ascii -NoNewline
          "name=$name" >> $env:GITHUB_OUTPUT
          "{0:N1} MB" -f ((Get-Item $name).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: AIUsageTray-win
          path: dist/AIUsageTray
          retention-days: 30

      - name: 建立 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.zip.outputs.name }}
            ${{ steps.zip.outputs.name }}.sha256
          generate_release_notes: true
